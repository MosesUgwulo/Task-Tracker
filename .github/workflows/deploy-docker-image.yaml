name: Deploy Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Azure
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Login to ACR
      uses: docker/login-action@v2
      with:
        registry: tasktrackeracr25.azurecr.io
        username: ${{ secrets.AZURE_CLIENT_ID }}
        password: ${{ secrets.AZURE_CLIENT_SECRET }}

    - name: Build, tag and push Docker image
      run: |
        docker build -t tasktrackeracr25.azurecr.io/task-tracker:latest .
        docker push tasktrackeracr25.azurecr.io/task-tracker:latest
      
    - name: Restart App Service
      run: |
        az webapp restart --name TaskTracker-ALWA --resource-group TaskTracker-RG

